<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="js.js" defer></script>
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Michroma&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">The 8-Digit Calculator</div>
    <div class="main">
        <div class="calculator">
            <div class="display"></div>
            <div class="operators">
                <div>+</div>
                <div>-</div>
                <div>*</div>
                <div>/</div>
            </div>
            <div class="buttons">
                <div class="not-equals">
                    <div>9</div>
                    <div>8</div>
                    <div>7</div>
                    <div>6</div>
                    <div>5</div>
                    <div>4</div>
                    <div>3</div>
                    <div>2</div>
                    <div>1</div>
                    <div>0</div>
                    <div>.</div>
                    <div>C</div>
                </div>
                <div class="equals">=</div>
            </div>
        </div>
    </div>
    <div class="footer">DON'T LOSE YOUR SMILE! © 2025 Midhin Lal | Built with HTML, CSS, and JavaScript</div>
</body>
</html>
